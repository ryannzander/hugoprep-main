<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- Accounts are paused (2026-11-20). Remove the next line to bring login and signup back. -->
<meta http-equiv="refresh" content="0; url=index.html" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up | HugoPrep</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/theme.css" />
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="index.html" class="logo"><span class="lg-hugo">Hugo</span><span class="lg-prep">Prep</span></a>
    <div class="nav-cta">
      <a href="index.html" class="btn btn-ghost">Back to site</a>
    </div>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow"><span class="dot"></span> Create Account</span>
    <h1 style="margin-top:14px">Sign up for HugoPrep</h1>
    <p class="auth-sub">Create an account, then book your free 15-minute intro. Once that's done, we'll approve your account so you can book real tutoring sessions.</p>

    <div class="auth-msg" id="authMsg"></div>

    <form id="signupForm">
      <div class="field-row">
        <div class="field">
          <label for="firstName">First name</label>
          <input type="text" id="firstName" name="firstName" placeholder="Jamie" required autocomplete="given-name" />
        </div>
        <div class="field">
          <label for="lastName">Last name</label>
          <input type="text" id="lastName" name="lastName" placeholder="Smith" required autocomplete="family-name" />
        </div>
      </div>
      <div class="field">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone" placeholder="416-000-0000" required autocomplete="tel" />
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@email.com" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required minlength="6" autocomplete="new-password" />
        <p class="hint" id="pwHint"></p>
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Create Account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</main>

<footer class="simple">© <span id="year"></span> HugoPrep · Toronto, Ontario</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const form = document.getElementById('signupForm');
  const msgEl = document.getElementById('authMsg');
  const submitBtn = document.getElementById('submitBtn');
  const pwHint = document.getElementById('pwHint');
  const confirmInput = document.getElementById('confirmPassword');

  function showMsg(text, type) {
    msgEl.textContent = text;
    msgEl.className = 'auth-msg show ' + type;
  }

  confirmInput.addEventListener('input', () => {
    const pw = document.getElementById('password').value;
    const cpw = confirmInput.value;
    pwHint.textContent = cpw && pw !== cpw ? "Passwords don't match yet." : '';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msgEl.className = 'auth-msg';

    if (!requireSupabaseOrWarn(msgEl)) return;

    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = confirmInput.value;

    if (password !== confirmPassword) {
      showMsg("Those passwords don't match. Please re-check them.", 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account...';

    const { data, error } = await supabaseClient.auth.signUp({
      email,
      password,
      options: {
        data: {
          first_name: firstName,
          last_name: lastName,
          phone: phone || null
        }
      }
    });

    if (error) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create Account';
      showMsg(error.message || 'Something went wrong creating your account.', 'error');
      return;
    }

    if (data.session) {
      // Logged in immediately, go straight to the account/booking page.
      submitBtn.textContent = 'Taking you to your account...';
      window.location.href = 'dashboard.html';
      return;
    }

    // Fallback: only reached if email confirmation is required on this project.
    submitBtn.disabled = false;
    submitBtn.textContent = 'Create Account';
    showMsg(
      "You're signed up! Check your email to confirm your account, then book your free 15-minute intro. We'll approve your account for booking after that call.",
      'success'
    );
    form.reset();
  });
</script>
</body>
</html>
